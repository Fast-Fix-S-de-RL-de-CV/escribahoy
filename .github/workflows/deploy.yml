name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to escribahoy.com
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 67.227.249.163
          port: 22
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/escribahoy
            echo "==> fetch + reset"
            git fetch origin main
            git reset --hard origin/main
            echo "==> npm install"
            npm install --no-audit --no-fund
            echo "==> build"
            npm run build
            echo "==> restart pm2"
            pm2 restart escribahoy --update-env
            pm2 save
            echo "==> done"
