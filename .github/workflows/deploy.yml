name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to escribahoy.com
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Servidor dedicado .12 (migrado desde el VPS .163 en jun-2026).
          # Auth por LLAVE dedicada (secrets.SERVER_SSH_KEY), no password root.
          host: 67.225.139.12
          port: 522
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /var/www/escribahoy
            echo "==> fetch"
            git fetch origin main
            # ¿Cambiaron dependencias? Solo entonces npm install.
            # (better-sqlite3 es nativo y se compiló a mano con gcc-toolset-12;
            #  un npm install ciego en cada deploy podría romperlo.)
            CHANGED="$(git diff --name-only HEAD origin/main || true)"
            git reset --hard origin/main
            if echo "$CHANGED" | grep -qE '(^|/)package(-lock)?\.json$'; then
              echo "==> deps cambiaron: npm install"
              NATIVE=node_modules/better-sqlite3/build/Release/better_sqlite3.node
              BACKUP=/root/escribahoy-backups/better_sqlite3.node
              # Respalda el .node compilado a mano antes de que npm lo pueda pisar.
              [ -f "$NATIVE" ] && cp -a "$NATIVE" "$BACKUP" || true
              npm install --no-audit --no-fund
              # Red de seguridad: si npm rompió/borró el módulo nativo, restáuralo.
              # (En este server better-sqlite3 no compila sin gcc-toolset-12, así que
              #  un rebuild fallido dejaría la app sin base de datos.)
              if ! node -e "require('better-sqlite3')" 2>/dev/null; then
                echo "==> better-sqlite3 quedó roto tras npm install: restaurando binario"
                mkdir -p "$(dirname "$NATIVE")"
                cp -a "$BACKUP" "$NATIVE"
                node -e "require('better-sqlite3'); console.log('==> binario nativo restaurado OK')"
              else
                echo "==> better-sqlite3 carga correctamente"
              fi
            else
              echo "==> sin cambios de deps: omito npm install (protege better-sqlite3)"
            fi
            echo "==> build"
            npm run build
            echo "==> restart pm2"
            pm2 restart escribahoy --update-env
            pm2 save
            echo "==> done"
